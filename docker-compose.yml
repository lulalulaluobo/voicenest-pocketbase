version: '3.8'

services:
  voicenest:
    image: ${VOICENEST_IMAGE:-lulalulaluobo/voicenest:latest}
    container_name: voicenest
    ports:
      - "${PB_BIND_ADDRESS:-127.0.0.1}:8090:8090"
    environment:
      # 仅运行期注入；缺失时 PocketBase 启动后 wechat hook 会拒绝解密
      - VN_ENCRYPTION_KEY=${VN_ENCRYPTION_KEY:?VN_ENCRYPTION_KEY 未设置}
      # 仅首次创建数据库时由入口脚本校验；后续重启不再需要保留这两个变量。
      - PB_SUPERUSER_EMAIL=${PB_SUPERUSER_EMAIL:-}
      - PB_SUPERUSER_PASSWORD=${PB_SUPERUSER_PASSWORD:-}
    volumes:
      - ./pb_data:/pb_data
    restart: unless-stopped
