<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d2026" />
      <stop offset="40%" stop-color="#15171c" />
      <stop offset="100%" stop-color="#0b0c0e" />
    </linearGradient>

    <!-- 霓虹微光渐变 -->
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- 图标金属微光渐变 -->
    <linearGradient id="metal-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>

    <!-- 底部软阴影 -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 图标底板 -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- 边缘微弱光环 -->
  <rect x="4" y="4" width="504" height="504" rx="124" fill="none" stroke="url(#neon-glow)" stroke-width="3" stroke-opacity="0.25" />

  <!-- 主体声音波动与麦克风聚合图形 -->
  <g filter="url(#soft-shadow)">
    <!-- 外侧渐变波动光环（左侧与右侧） -->
    <path d="M 170,256 A 86,86 0 0,1 342,256" fill="none" stroke="url(#neon-glow)" stroke-width="12" stroke-linecap="round" opacity="0.85" />
    <path d="M 120,256 A 136,136 0 0,1 392,256" fill="none" stroke="url(#neon-glow)" stroke-width="6" stroke-linecap="round" opacity="0.45" />

    <!-- 麦克风极简立体线条 -->
    <!-- 麦克风核心胶囊形 -->
    <rect x="220" y="140" width="72" height="160" rx="36" fill="url(#bg-grad)" stroke="url(#neon-glow)" stroke-width="10" />
    <rect x="232" y="152" width="48" height="60" rx="24" fill="url(#metal-glow)" stroke="none" opacity="0.15" />
    
    <!-- 麦克风音网横线 -->
    <line x1="220" y1="210" x2="292" y2="210" stroke="url(#neon-glow)" stroke-width="6" opacity="0.6" />
    <line x1="222" y1="240" x2="290" y2="240" stroke="url(#neon-glow)" stroke-width="4" opacity="0.4" />

    <!-- 麦克风外层U型支架 -->
    <path d="M 180,220 C 180,310 332,310 332,220" fill="none" stroke="url(#neon-glow)" stroke-width="10" stroke-linecap="round" />

    <!-- 麦克风立柱支脚 -->
    <line x1="256" y1="300" x2="256" y2="368" stroke="url(#neon-glow)" stroke-width="10" stroke-linecap="round" />
    
    <!-- 麦克风椭圆底座 -->
    <path d="M 200,368 C 200,368 210,388 256,388 C 302,388 312,368 312,368" fill="none" stroke="url(#neon-glow)" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
